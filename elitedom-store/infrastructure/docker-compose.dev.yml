# =============================================================================
# Elitedom Store — Docker Compose (Local Development Overrides)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================

services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_LOG_STATEMENT: all

  odoo:
    command: ["odoo", "--dev=all"]
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLL_PORT:-8072}:8072"

  fastapi:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    volumes:
      - ../backend:/app

  celery-worker:
    volumes:
      - ../backend:/app

  celery-beat:
    volumes:
      - ../backend:/app

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-elitedom_redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"

  nginx-proxy-manager:
    profiles:
      - production

  portainer:
    profiles:
      - production

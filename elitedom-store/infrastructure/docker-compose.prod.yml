# =============================================================================
# Elitedom Store — Docker Compose (Production Overrides)
# Use together with docker-compose.yml.
# =============================================================================

services:
  fastapi:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STAFF_MFA_REQUIRED: "true"
      RATE_LIMIT_BACKEND: redis
      # Production traffic reaches FastAPI through Nginx Proxy Manager. Force
      # operators to identify that trusted peer explicitly so forwarded client
      # addresses create independent rate-limit buckets instead of one shared
      # proxy bucket. Application startup also rejects an empty value.
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS?Set TRUSTED_PROXY_IPS to the Nginx Proxy Manager internal IP}"

  celery-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  celery-beat:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  frontend:
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:?Set VITE_API_URL to the browser-reachable HTTPS API URL}"
        VITE_SITE_URL: "${VITE_SITE_URL:?Set VITE_SITE_URL to the public HTTPS storefront URL}"
        VITE_MEDIA_URL: "${VITE_MEDIA_URL:-}"
        VITE_DEMO_CATALOG_FALLBACK: "${VITE_DEMO_CATALOG_FALLBACK:-false}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_APPLE_CLIENT_ID: "${VITE_APPLE_CLIENT_ID:-}"

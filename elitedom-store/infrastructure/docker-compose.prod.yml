# =============================================================================
# Elitedom Store — Docker Compose (Production Overrides)
# Use together with docker-compose.yml.
# =============================================================================

services:
  fastapi:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STAFF_MFA_REQUIRED: "true"
      RATE_LIMIT_BACKEND: redis

  celery-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  celery-beat:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  frontend:
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:?Set VITE_API_URL to the browser-reachable HTTPS API URL}"
        VITE_SITE_URL: "${VITE_SITE_URL:?Set VITE_SITE_URL to the public HTTPS storefront URL}"
        VITE_MEDIA_URL: "${VITE_MEDIA_URL:-}"
        VITE_DEMO_CATALOG_FALLBACK: "${VITE_DEMO_CATALOG_FALLBACK:-false}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_APPLE_CLIENT_ID: "${VITE_APPLE_CLIENT_ID:-}"

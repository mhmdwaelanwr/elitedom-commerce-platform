# =============================================================================
# Elitedom Store — Docker Compose (Production Overrides)
# Use together with docker-compose.yml.
# =============================================================================

services:
  fastapi:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STAFF_MFA_REQUIRED: "true"
      RATE_LIMIT_BACKEND: redis

  celery-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  celery-beat:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the browser-reachable HTTPS API URL}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL to the public HTTPS storefront URL}"
        NEXT_PUBLIC_MEDIA_URL: "${NEXT_PUBLIC_MEDIA_URL:-}"

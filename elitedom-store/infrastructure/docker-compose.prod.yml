# =============================================================================
# Elitedom Store — Docker Compose (Production Overrides)
# Use together with docker-compose.yml.
# =============================================================================

networks:
  elitedom-net:
    ipam:
      config:
        - subnet: "${ELITEDOM_DOCKER_SUBNET:-172.30.0.0/24}"

services:
  fastapi:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_VERSION: "${RELEASE_REF:?Set RELEASE_REF to the deployed Git commit SHA}"
      STAFF_MFA_REQUIRED: "true"
      RATE_LIMIT_BACKEND: redis
      # Only the pinned Nginx Proxy Manager peer may supply X-Forwarded-For.
      TRUSTED_PROXY_IPS: "${NGINX_PROXY_INTERNAL_IP:-172.30.0.10}"

  celery-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  celery-beat:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  frontend:
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:?Set VITE_API_URL to the browser-reachable HTTPS API URL}"
        VITE_SITE_URL: "${VITE_SITE_URL:?Set VITE_SITE_URL to the public HTTPS storefront URL}"
        VITE_MEDIA_URL: "${VITE_MEDIA_URL:-}"
        VITE_DEMO_CATALOG_FALLBACK: "${VITE_DEMO_CATALOG_FALLBACK:-false}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_APPLE_CLIENT_ID: "${VITE_APPLE_CLIENT_ID:-}"

  nginx-proxy-manager:
    networks:
      elitedom-net:
        ipv4_address: "${NGINX_PROXY_INTERNAL_IP:-172.30.0.10}"

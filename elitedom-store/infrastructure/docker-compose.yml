# =============================================================================
# Elitedom Store — Docker Compose base
# Combine with docker-compose.dev.yml for local development or production.
# =============================================================================

networks:
  elitedom-net:
    driver: bridge

volumes:
  pg-data:
  odoo-data:
  redis-data:
  media-data:
  nginx-data:
  nginx-letsencrypt:
  portainer-data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: elitedom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elitedom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-elitedom_db}
      APP_POSTGRES_DB: ${APP_POSTGRES_DB:-elitedom_store}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [elitedom-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elitedom} -d ${POSTGRES_DB:-elitedom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-db-init:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-elitedom}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_POSTGRES_DB: ${APP_POSTGRES_DB:-elitedom_store}
    command:
      - /bin/sh
      - -ec
      - |
        if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$$APP_POSTGRES_DB'" | grep -q 1; then
          echo "Application database $$APP_POSTGRES_DB already exists."
        else
          createdb "$$APP_POSTGRES_DB"
          echo "Created application database $$APP_POSTGRES_DB."
        fi
    networks: [elitedom-net]

  odoo:
    image: odoo:17.0
    container_name: elitedom-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-elitedom}
      PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ODOO_DB: ${ODOO_DB:-elitedom_db}
      ELITEDOM_CONNECTOR_ENABLED: ${ODOO_WEBHOOKS_ENABLED:-false}
      ELITEDOM_API_BASE_URL: ${ODOO_FASTAPI_WEBHOOK_URL:-http://fastapi:8000/api/v1/webhooks/odoo}
      ELITEDOM_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-}
      ELITEDOM_CONNECTOR_TIMEOUT_SECONDS: ${ODOO_CONNECTOR_TIMEOUT_SECONDS:-10}
      ELITEDOM_CONNECTOR_MAX_ATTEMPTS: ${ODOO_CONNECTOR_MAX_ATTEMPTS:-8}
      ELITEDOM_CONNECTOR_RETENTION_DAYS: ${ODOO_CONNECTOR_RETENTION_DAYS:-30}
    volumes:
      - odoo-data:/var/lib/odoo
      - ../odoo/addons:/mnt/extra-addons:ro
    networks: [elitedom-net]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8069), 3); connection.close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: elitedom-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks: [elitedom-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: elitedom-fastapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: [../.env]
    volumes:
      - media-data:/app/media
    networks: [elitedom-net]
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${FASTAPI_WORKERS:-2}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000/api/v1}"
        VITE_SITE_URL: "${VITE_SITE_URL:-http://localhost:3000}"
        VITE_MEDIA_URL: "${VITE_MEDIA_URL:-}"
        VITE_DEMO_CATALOG_FALLBACK: "${VITE_DEMO_CATALOG_FALLBACK:-false}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_APPLE_CLIENT_ID: "${VITE_APPLE_CLIENT_ID:-}"
    container_name: elitedom-storefront
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [elitedom-net]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: elitedom-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: [../.env]
    networks: [elitedom-net]
    command: celery -A app.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    init: true
    security_opt: [no-new-privileges:true]

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: elitedom-celery-beat
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: [../.env]
    networks: [elitedom-net]
    command: celery -A app.celery_app beat --loglevel=info
    init: true
    security_opt: [no-new-privileges:true]

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: elitedom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${ADMIN_BIND_IP:-127.0.0.1}:81:81"
    volumes:
      - nginx-data:/data
      - nginx-letsencrypt:/etc/letsencrypt
    networks: [elitedom-net]

  portainer:
    image: portainer/portainer-ce:latest
    container_name: elitedom-portainer
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:${PORTAINER_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks: [elitedom-net]

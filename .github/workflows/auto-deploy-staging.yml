name: Auto Deploy Staging

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Validate auto-deploy eligibility
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      site_url: ${{ steps.target.outputs.site_url }}
      api_url: ${{ steps.target.outputs.api_url }}
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve exact qualified SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "workflow_run head_sha is not a valid SHA" >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo "SHA is not reachable from main" >&2; exit 1; }
          echo "release_ref=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Qualified staging SHA: $RELEASE_SHA"

      - name: Load staging environment contract
        id: target
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          [[ "$SITE_URL" =~ ^https://[^/]+/?$ ]] || { echo "SITE_URL must be an HTTPS origin" >&2; exit 2; }
          [[ "$API_URL" =~ ^https://[^/]+/?$ ]] || { echo "API_URL must be an HTTPS origin" >&2; exit 2; }
          printf 'site_url=%s\n' "${SITE_URL%/}" >> "$GITHUB_OUTPUT"
          printf 'api_url=%s\n' "${API_URL%/}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to staging
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: staging
    outputs:
      site_url: ${{ needs.pre-deploy.outputs.site_url }}
      api_url: ${{ needs.pre-deploy.outputs.api_url }}
      release_ref: ${{ needs.pre-deploy.outputs.release_ref }}
    env:
      RELEASE_REF: ${{ needs.pre-deploy.outputs.release_ref }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SITE_URL: ${{ needs.pre-deploy.outputs.site_url }}
      API_URL: ${{ needs.pre-deploy.outputs.api_url }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}

    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release and environment contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "release_ref must be a full Git SHA" >&2; exit 2; }
          git cat-file -e "${RELEASE_REF}^{commit}"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_REF" origin/main || { echo "release_ref is not reachable from main" >&2; exit 2; }
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo "Deployment secrets are incomplete" >&2; exit 2; }
          [[ "$DEPLOY_PATH" = /* ]] || { echo "DEPLOY_PATH must be an absolute environment variable" >&2; exit 2; }
          bash -n elitedom-store/infrastructure/scripts/deploy_release.sh

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtain runner public IPv4
        id: runner-ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [[ ! "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Failed to obtain valid runner IPv4 (got: $RUNNER_IP)" >&2
            exit 1
          fi
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "Runner IPv4: $RUNNER_IP"

      - name: Authorize SSH ingress for runner
        id: sg-authorize
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="${{ steps.runner-ip.outputs.runner_ip }}"
          SG_ID="${EC2_SECURITY_GROUP_ID}"
          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text 2>/dev/null || true)"
          if [[ -z "$RULE_ID" || "$RULE_ID" == "None" ]]; then
            echo "sg_rule_id=" >> "$GITHUB_OUTPUT"
            echo "WARNING: Could not capture SecurityGroupRuleId — cleanup may require manual intervention" >&2
          else
            echo "sg_rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
            echo "Authorized SSH ingress: $RULE_ID"
          fi

      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Generate temporary SSH key pair
        id: ssh-key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -f "$HOME/.ssh/id_deploy_temp" -N "" -q
          chmod 600 "$HOME/.ssh/id_deploy_temp"
          echo "private_key_file=$HOME/.ssh/id_deploy_temp" >> "$GITHUB_OUTPUT"
          echo "public_key_file=$HOME/.ssh/id_deploy_temp.pub" >> "$GITHUB_OUTPUT"

      - name: Install temporary public key on server
        shell: bash
        run: |
          set -euo pipefail
          PUB_KEY="$(cat "$HOME/.ssh/id_deploy_temp.pub")"
          ssh -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo '${PUB_KEY}' >> ~/.ssh/authorized_keys && sort -u -o ~/.ssh/authorized_keys ~/.ssh/authorized_keys"

      - name: Remove temporary public key from server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PUB_KEY="$(cat "$HOME/.ssh/id_deploy_temp.pub" 2>/dev/null || true)"
          if [[ -n "$PUB_KEY" ]]; then
            ssh -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "sed -i '\\|${PUB_KEY}|d' ~/.ssh/authorized_keys" 2>/dev/null || true
          fi

      - name: Verify remote deployment host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy_temp" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker compose version >/dev/null && git --version >/dev/null'

      - name: Execute guarded release deployment
        shell: bash
        run: |
          set -euo pipefail
          remote_script="/tmp/elitedom-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          cleanup_remote() {
            printf -v cleanup_cmd 'rm -f %q' "$remote_script"
            ssh -i "$HOME/.ssh/id_deploy_temp" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "$cleanup_cmd" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT
          scp -i "$HOME/.ssh/id_deploy_temp" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            elitedom-store/infrastructure/scripts/deploy_release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_script"
          printf -v remote_cmd 'bash %q %q %q %q %q' \
            "$remote_script" "$RELEASE_REF" "$DEPLOY_PATH" "$SITE_URL" "$API_URL"
          ssh -i "$HOME/.ssh/id_deploy_temp" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_cmd" \
            | tee deployment.log

      - name: Revoke temporary SSH rule
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SG_RULE_ID="${{ steps.sg-authorize.outputs.sg_rule_id }}"
          SG_ID="${EC2_SECURITY_GROUP_ID}"
          if [[ -n "$SG_RULE_ID" && "$SG_RULE_ID" != "None" ]]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" \
              --security-group-rule-id "$SG_RULE_ID" 2>/dev/null || true
            echo "Revoked SSH rule: $SG_RULE_ID"
          else
            echo "No captured rule ID to revoke"
          fi

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-deploy-staging-${{ github.run_id }}
          path: deployment.log
          if-no-files-found: warn
          retention-days: 30

  launch-smoke:
    name: Verify deployed release
    needs: deploy
    if: success()
    uses: ./.github/workflows/launch-smoke.yml
    with:
      site_url: ${{ needs.deploy.outputs.site_url }}
      api_url: ${{ needs.deploy.outputs.api_url }}
      release_ref: ${{ needs.deploy.outputs.release_ref }}

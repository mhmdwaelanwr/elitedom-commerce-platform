name: Documentation Bootstrap

on:
  push:
    branches:
      - agent/enterprise-documentation-overhaul

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply generated enterprise documentation bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .tmp/apply_docs_bundle.py

      - name: Stage generated repository state
        run: git add -A

      - name: Validate documentation and repository contracts
        run: |
          python3 elitedom-store/scripts/validate_documentation.py
          python3 elitedom-store/scripts/check_repository_hygiene.py

      - name: Commit validated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Docs: establish enterprise documentation system"
          git push origin HEAD:${GITHUB_REF_NAME}

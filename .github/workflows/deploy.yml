name: Deploy Release

on:
  workflow_call:
    inputs:
      environment:
        description: Protected GitHub Environment to deploy
        required: true
        type: string
      release_ref:
        description: Full 40-character Git commit SHA reachable from main
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      release_ref:
        description: Full 40-character Git commit SHA reachable from main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ inputs.environment }}
    outputs:
      site_url: ${{ steps.target.outputs.site_url }}
      api_url: ${{ steps.target.outputs.api_url }}
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SITE_URL: ${{ vars.SITE_URL }}
      API_URL: ${{ vars.API_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
      REQUIRE_ODOO_SMOKE: ${{ vars.REQUIRE_ODOO_SMOKE }}

    steps:
      - name: Check out exact release deployment tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Validate release and environment contract
        id: target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "release_ref must be a full Git SHA" >&2; exit 2; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REF" ]] || { echo "deployment tooling checkout does not match release_ref" >&2; exit 2; }
          git cat-file -e "${RELEASE_REF}^{commit}"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_REF" origin/main || { echo "release_ref is not reachable from main" >&2; exit 2; }
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_KNOWN_HOSTS" && -n "$EC2_INSTANCE_ID" ]] || { echo "Deployment secrets are incomplete" >&2; exit 2; }
          [[ "$DEPLOY_PATH" = /* ]] || { echo "DEPLOY_PATH must be an absolute environment variable" >&2; exit 2; }
          [[ "$SITE_URL" =~ ^https://[^/]+/?$ ]] || { echo "SITE_URL must be an HTTPS origin" >&2; exit 2; }
          [[ "$API_URL" =~ ^https://[^/]+/?$ ]] || { echo "API_URL must be an HTTPS origin" >&2; exit 2; }
          bash -n elitedom-store/infrastructure/scripts/deploy_release.sh
          printf 'site_url=%s\n' "${SITE_URL%/}" >> "$GITHUB_OUTPUT"
          printf 'api_url=%s\n' "${API_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtain runner public IPv4
        id: runner-ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [[ ! "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Failed to obtain valid runner IPv4 (got: $RUNNER_IP)" >&2
            exit 1
          fi
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "Runner IPv4: $RUNNER_IP"

      - name: Authorize SSH ingress for runner
        id: sg-authorize
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="${{ steps.runner-ip.outputs.runner_ip }}"
          SG_ID="${EC2_SECURITY_GROUP_ID}"
          EXISTING_RULES="$(aws ec2 describe-security-group-rules \
            --region "$AWS_REGION" \
            --filters \
              "Name=group-id,Values=$SG_ID" \
              "Name=tag:Name,Values=elitedom-ci-runner" \
              "Name=tag:EphemeralRunner,Values=true" \
            --query 'SecurityGroupRules[].SecurityGroupRuleId' \
            --output text 2>/dev/null || true)"
          if [[ -n "$EXISTING_RULES" && "$EXISTING_RULES" != "None" ]]; then
            for existing_rule in $EXISTING_RULES; do
              aws ec2 revoke-security-group-ingress \
                --region "$AWS_REGION" \
                --group-id "$SG_ID" \
                --security-group-rule-id "$existing_rule" 2>/dev/null || true
            done
          fi
          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" \
            --tag-specifications 'ResourceType=security-group-rule,Tags=[{Key=Name,Value=elitedom-ci-runner},{Key=EphemeralRunner,Value=true}]' \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text 2>/dev/null || true)"
          if [[ -z "$RULE_ID" || "$RULE_ID" == "None" ]]; then
            echo "sg_rule_id=" >> "$GITHUB_OUTPUT"
            echo "WARNING: Could not capture SecurityGroupRuleId; final cleanup will fall back to the workflow tags." >&2
          else
            echo "sg_rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
            echo "Authorized SSH ingress: $RULE_ID"
          fi

      - name: Generate ephemeral SSH key pair
        id: ssh-keygen
        shell: bash
        run: |
          set -euo pipefail
          SSH_DIR="$HOME/.ssh"
          install -m 700 -d "$SSH_DIR"
          KEY_PATH="$SSH_DIR/id_deploy_ephemeral"
          ssh-keygen -t ed25519 -f "$KEY_PATH" -N "" -C "github-actions-ephemeral" -q
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"
          echo "pub_key=$(cat "${KEY_PATH}.pub")" >> "$GITHUB_OUTPUT"

      - name: Push public key via EC2 Instance Connect
        shell: bash
        run: |
          set -euo pipefail
          PUB_KEY="${{ steps.ssh-keygen.outputs.pub_key }}"
          aws ec2-instance-connect send-ssh-public-key \
            --region "$AWS_REGION" \
            --instance-id "$EC2_INSTANCE_ID" \
            --instance-os-user "$DEPLOY_USER" \
            --ssh-public-key "$PUB_KEY"
          echo "Public key pushed via EC2 Instance Connect (valid for 60s)"

      - name: Configure pinned SSH client
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="${{ steps.ssh-keygen.outputs.key_path }}"
          SSH_DIR="$HOME/.ssh"
          install -m 700 -d "$SSH_DIR"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"
          cat > "$SSH_DIR/config" << CONF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $KEY_PATH
            IdentitiesOnly yes
            UserKnownHostsFile $SSH_DIR/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 15
          CONF
          chmod 600 "$SSH_DIR/config"

      - name: Verify remote deployment host
        shell: bash
        run: |
          set -euo pipefail
          PUB_KEY="${{ steps.ssh-keygen.outputs.pub_key }}"
          aws ec2-instance-connect send-ssh-public-key \
            --region "$AWS_REGION" \
            --instance-id "$EC2_INSTANCE_ID" \
            --instance-os-user "$DEPLOY_USER" \
            --ssh-public-key "$PUB_KEY"
          ssh deploy-target \
            'docker compose version && git --version'

      - name: Execute guarded release deployment
        shell: bash
        run: |
          set -euo pipefail
          PUB_KEY="${{ steps.ssh-keygen.outputs.pub_key }}"
          aws ec2-instance-connect send-ssh-public-key \
            --region "$AWS_REGION" \
            --instance-id "$EC2_INSTANCE_ID" \
            --instance-os-user "$DEPLOY_USER" \
            --ssh-public-key "$PUB_KEY"
          remote_script="/tmp/elitedom-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          cleanup_remote() {
            ssh deploy-target "rm -f '$remote_script'" 2>/dev/null || true
          }
          trap cleanup_remote EXIT
          scp elitedom-store/infrastructure/scripts/deploy_release.sh \
            "deploy-target:$remote_script"
          printf -v remote_cmd 'bash %q %q %q %q %q' \
            "$remote_script" "$RELEASE_REF" "$DEPLOY_PATH" "$SITE_URL" "$API_URL"
          ssh deploy-target "$remote_cmd" | tee deployment.log

      - name: Revoke temporary SSH ingress
        if: always()
        shell: bash
        run: |
          set -u
          SG_RULE_ID="${{ steps.sg-authorize.outputs.sg_rule_id }}"
          SG_ID="${EC2_SECURITY_GROUP_ID}"
          if [[ -z "$SG_ID" ]]; then
            echo "No security group ID is available for SSH cleanup" >&2
            exit 0
          fi

          revoke_rule() {
            local rule_id="$1"
            if aws ec2 revoke-security-group-ingress \
              --region "$AWS_REGION" \
              --group-id "$SG_ID" \
              --security-group-rule-id "$rule_id" >/dev/null 2>&1; then
              echo "Revoked SSH rule: $rule_id"
            else
              echo "WARNING: Could not revoke SSH rule: $rule_id" >&2
            fi
          }

          if [[ -n "$SG_RULE_ID" && "$SG_RULE_ID" != "None" ]]; then
            revoke_rule "$SG_RULE_ID"
          fi

          STALE_RULES="$(aws ec2 describe-security-group-rules \
            --region "$AWS_REGION" \
            --filters \
              "Name=group-id,Values=$SG_ID" \
              "Name=tag:Name,Values=elitedom-ci-runner" \
              "Name=tag:EphemeralRunner,Values=true" \
            --query 'SecurityGroupRules[].SecurityGroupRuleId' \
            --output text 2>/dev/null || true)"
          if [[ -n "$STALE_RULES" && "$STALE_RULES" != "None" ]]; then
            for stale_rule in $STALE_RULES; do
              [[ "$stale_rule" == "$SG_RULE_ID" ]] && continue
              revoke_rule "$stale_rule"
            done
          fi

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-${{ inputs.environment }}-${{ github.run_id }}
          path: deployment.log
          if-no-files-found: warn
          retention-days: 30

  launch-smoke:
    name: Verify deployed release
    needs: deploy
    if: success()
    uses: ./.github/workflows/launch-smoke.yml
    with:
      site_url: ${{ needs.deploy.outputs.site_url }}
      api_url: ${{ needs.deploy.outputs.api_url }}
      release_ref: ${{ inputs.release_ref }}

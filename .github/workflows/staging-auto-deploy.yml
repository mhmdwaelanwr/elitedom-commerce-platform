name: Auto Deploy Qualified Staging

on:
  workflow_run:
    workflows:
      - Real Stack E2E
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy-qualified-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.STAGING_AUTO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      release_ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

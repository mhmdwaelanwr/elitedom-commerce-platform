name: Continuous Integration

on:
  workflow_dispatch:
  push:
    paths:
      - "elitedom-store/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "elitedom-store/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elitedom-store/backend
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-postgres-password
      ODOO_SYNC_ENABLED: "false"
      ODOO_WEBHOOKS_ENABLED: "true"
      ODOO_WEBHOOK_SECRET: ci-odoo-webhook-secret-with-at-least-32-characters

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            elitedom-store/backend/requirements.txt
            elitedom-store/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint backend
        run: python -m ruff check .

      - name: Test backend
        run: python -m pytest app/tests -q

  migrations:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elitedom-store/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: elitedom
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: elitedom_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitedom -d elitedom_store"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 20
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-characters
      POSTGRES_USER: elitedom
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: elitedom_store
      APP_POSTGRES_DB: elitedom_store
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      ODOO_DB: elitedom_odoo_ci
      ODOO_SYNC_ENABLED: "false"
      ODOO_WEBHOOKS_ENABLED: "false"
      ODOO_WEBHOOK_SECRET: ci-odoo-webhook-secret-with-at-least-32-characters

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            elitedom-store/backend/requirements.txt
            elitedom-store/backend/requirements-dev.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Confirm PostgreSQL connection
        run: |
          set -euxo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.config import get_settings

          settings = get_settings()
          engine = create_engine(settings.database_url_sync)
          with engine.connect() as connection:
              database, username = connection.execute(
                  text("select current_database(), current_user")
              ).one()
              print(f"Connected to database={database} as user={username}")
          engine.dispose()
          PY

      - name: Print migration graph
        run: |
          set -euxo pipefail
          python -m alembic heads --verbose
          python -m alembic history --verbose

      - name: Upgrade a fresh PostgreSQL database
        run: |
          set -euxo pipefail
          python -m alembic upgrade head
          python -m alembic current --verbose

      - name: Exercise latest downgrade and replay
        run: |
          set -euxo pipefail
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic current --verbose

      - name: Exercise full downgrade and replay
        run: |
          set -euxo pipefail
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current --verbose

  odoo-addon:
    name: Odoo 17 addon install and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate addon structure and contracts
        working-directory: elitedom-store
        run: python scripts/validate_odoo_addon.py

      - name: Install addon in clean Odoo and run module tests
        run: |
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "${GITHUB_WORKSPACE}/elitedom-store/odoo/addons:/mnt/extra-addons:ro" \
            odoo:17.0 \
            --database=elitedom_odoo_ci \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --init=elitedom_connector \
            --without-demo=all \
            --test-enable \
            --test-tags=/elitedom_connector \
            --stop-after-init \
            --no-http \
            --log-level=test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: elitedom-store/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: elitedom-store/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: elitedom-store/infrastructure

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare environment file
        run: cp ../.env.example ../.env

      - name: Validate development topology
        run: |
          docker compose \
            --env-file ../.env \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --quiet

      - name: Validate production topology
        env:
          ENVIRONMENT: production
          DEBUG: "false"
          NEXT_PUBLIC_API_URL: https://store.example.com/api/v1
          SECRET_KEY: ci-production-secret-key-with-at-least-32-characters
          JWT_SECRET_KEY: ci-production-jwt-key-with-at-least-32-characters
          POSTGRES_PASSWORD: ci-production-postgres-password
          REDIS_PASSWORD: ci-production-redis-password
          ODOO_SYNC_ENABLED: "false"
          ODOO_WEBHOOKS_ENABLED: "false"
          CORS_ORIGINS: https://store.example.com
          ALLOWED_HOSTS: api.store.example.com
        run: |
          docker compose \
            --env-file ../.env \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            config --quiet

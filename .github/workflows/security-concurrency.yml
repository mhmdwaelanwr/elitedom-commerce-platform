name: Security Concurrency

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "elitedom-store/backend/**"
      - ".github/workflows/security-concurrency.yml"

permissions:
  contents: read

concurrency:
  group: security-concurrency-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  postgres-auth-concurrency:
    name: Security concurrency (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: elitedom-store/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: elitedom
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: elitedom_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitedom -d elitedom_store"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 20
    env:
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-characters
      POSTGRES_USER: elitedom
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: elitedom_store
      APP_POSTGRES_DB: elitedom_store
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      ODOO_DB: elitedom_odoo_ci
      ODOO_SYNC_ENABLED: "false"
      ODOO_WEBHOOKS_ENABLED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            elitedom-store/backend/requirements.txt
            elitedom-store/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Upgrade PostgreSQL schema
        run: python -m alembic upgrade head

      - name: Exercise refresh and OTP races
        run: PYTHONPATH=. python scripts/security_concurrency_smoke.py
